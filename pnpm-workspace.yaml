# npm security best practices
# Source: https://github.com/lirantal/npm-security-best-practices


# Require at least 30 days since package release (specified in minutes)
minimumReleaseAge: 43200

# Fail if a package's trust level has decreased (pnpm 10.21+)
trustPolicy: no-downgrade

# Allow specific packages or versions to bypass the check when needed
# example:
# trustPolicyExclude:
#   - 'chokidar@4.0.3'
#   - 'webpack@4.47.0 || 5.102.1'

# Ignore the check for packages published more than 30 days ago (pnpm 10.27+)
# Useful for older packages that pre-date provenance support
# trustPolicyIgnoreAfter: 43200

allowBuilds:
  esbuild: true
  rolldown: true
  unrs-resolver: true
  '@tailwindcss/oxide': true
  sharp: true

# Strictly enforce build dependencies, otherwise pnpm will error
strictDepBuilds: true

# Block exotic subdependencies such as those pulled from  Git sources
blockExoticSubdeps: true

# Exact security-patch exceptions approved for the October 14 Next.js advisory.
# https://nextjs.org/blog/nextjs-security-update-october-14-2026
# These releases complete the normal 30-day cooldown on November 13, 2026.
minimumReleaseAgeExclude:
  - 'next@15.5.28'
  - '@next/env@15.5.28'
  - '@next/swc-darwin-x64@15.5.28'
  - '@next/swc-darwin-arm64@15.5.28'
  - '@next/swc-linux-x64-gnu@15.5.28'
  - '@next/swc-linux-x64-musl@15.5.28'
  - '@next/swc-win32-x64-msvc@15.5.28'
  - '@next/swc-linux-arm64-gnu@15.5.28'
  - '@next/swc-linux-arm64-musl@15.5.28'
  - '@next/swc-win32-arm64-msvc@15.5.28'
